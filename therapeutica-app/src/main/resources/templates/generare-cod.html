<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>Invitații — Therapeutica</title>
</head>
<body>
<div layout:fragment="content" class="max-w-6xl mx-auto p-6 md:p-10">

    <a th:href="${dashboardUrl}"
       class="text-brand-teal font-bold">Înapoi la dashboard</a>

    <h1 class="text-3xl font-bold text-brand-navy mt-6"
        th:text="${'Invită un ' + tipCont}"></h1>

    <p class="text-gray-600 mt-2">
        Destinatarul își activează contul folosind codul primit și CNP-ul.
    </p>

    <div th:if="${success}" th:text="${success}"
         class="bg-green-50 text-green-800 rounded-xl p-4 mt-6"></div>

    <div th:if="${rezultat != null and rezultat.codUnic == null}"
         th:text="${rezultat.mesaj}"
         class="bg-red-50 text-red-800 rounded-xl p-4 mt-6"></div>

    <form th:action="@{/generare-cod}" th:object="${request}" method="post"
          class="bg-white border rounded-2xl p-6 mt-6 grid md:grid-cols-2 gap-5">

        <input type="hidden" th:field="*{rolDestinatar}">

        <label class="block">
            <span class="font-bold">Nume</span>
            <input type="text" th:field="*{numeDestinatar}" required
                   class="w-full border rounded-lg p-3 mt-1">
        </label>

        <label class="block">
            <span class="font-bold">Prenume</span>
            <input type="text" th:field="*{prenumeDestinatar}" required
                   class="w-full border rounded-lg p-3 mt-1">
        </label>

        <label class="block">
            <span class="font-bold">Email</span>
            <input type="email" th:field="*{emailDestinatar}" required
                   class="w-full border rounded-lg p-3 mt-1">
        </label>

        <label class="block">
            <span class="font-bold">CNP</span>
            <input type="text" th:field="*{cnpDestinatar}" required
                   inputmode="numeric" pattern="[0-9]{13}" maxlength="13"
                   class="w-full border rounded-lg p-3 mt-1">
        </label>

        <label class="block">
            <span class="font-bold">Telefon, opțional</span>
            <input type="tel" th:field="*{telefonDestinatar}" maxlength="20"
                   class="w-full border rounded-lg p-3 mt-1">
        </label>

        <div class="flex items-end">
            <button type="submit"
                    class="bg-brand-navy text-white font-bold rounded-lg px-6 py-3">
                Generează invitația
            </button>
        </div>
    </form>

    <div th:if="${rezultat != null and rezultat.codUnic != null}"
         class="bg-brand-teal text-white rounded-2xl p-6 mt-6">
        <p>Codul de activare:</p>
        <p th:text="${rezultat.codUnic}"
           class="font-mono text-3xl font-bold tracking-widest mt-2"></p>
        <p th:text="${rezultat.emailDestinatar}" class="mt-2"></p>
        <a th:if="${rezultat.whatsappLink != null}"
           th:href="${rezultat.whatsappLink}" target="_blank" rel="noopener"
           class="inline-block underline mt-4">Deschide WhatsApp</a>
    </div>

    <h2 class="text-xl font-bold text-brand-navy mt-10 mb-4">
        Evidența invitațiilor
    </h2>

    <p th:if="${coduri.isEmpty()}" class="text-gray-500">
        Nu există invitații.
    </p>

    <div th:each="cod : ${coduri}"
         class="bg-white border rounded-xl p-5 mb-3">
        <p class="font-bold"
           th:text="${cod.numeDestinatar + ' ' + cod.prenumeDestinatar}"></p>
        <p th:text="${cod.emailDestinatar}"></p>
        <p class="font-mono mt-2" th:text="${cod.codUnic}"></p>
        <p class="text-sm text-gray-600" th:text="${cod.status}"></p>

        <form th:if="${cod.status.name() == 'NEUTILIZAT'}"
              th:action="@{/generare-cod/{id}/anuleaza(id=${cod.id})}"
              method="post" class="mt-3">
            <button type="submit" class="text-red-700 font-bold">
                Anulează invitația
            </button>
        </form>
    </div>
</div>
</body>
</html>
